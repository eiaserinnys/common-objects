<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
let SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);

    toast.style.top = ((document.getElementById('btns') ? document.getElementById('btns').offsetTop + document.getElementById('btns').offsetHeight : 0) + 8) + 'px'; toast.classList.add('show');
    clearTimeout(flashT); flashT = setTimeout(() => { ui._flash = false; toast.classList.remove('show'); ui.render(); }, ms); };
  // One frame driver for every running animation: each frame runs all the steps, then draws once (two animations at
  // the same time no longer draw twice). It follows the screen's frames, with a timer fallback for when frames don't
  // come (headless shots, a hidden tab). ui.invalidate() asks for one redraw on the next frame (used while dragging).
  const steps = new Set(); let driving = false, lastT = 0, fbT = 0;
  const frame = () => { if (!driving) return; driving = false; clearTimeout(fbT);
    const now = performance.now(), dt = Math.max(0, Math.min(.05, (now - lastT) / 1000)); lastT = now;
    for (const s of [...steps]) if (s(dt) === false) steps.delete(s);
    ui.render(); if (steps.size) drive(); };
  const drive = () => { if (driving) return; driving = true; requestAnimationFrame(frame); fbT = setTimeout(frame, 60); };
  ui.animate = step => { if (!steps.size && !driving) lastT = performance.now(); steps.add(step); drive(); };
  ui.invalidate = () => drive();

  // clickable parts react on press, not on click: while something animates, the scene is redrawn every frame, so the
  // element under the pointer is replaced between press and release and a 'click' would never fire
  svg.addEventListener('pointerdown', e => { if (e.button) return; const a = e.target.closest('[data-act]'); if (!a || !cfg.acts || !cfg.acts[a.dataset.act]) return;
    e.preventDefault(); cfg.acts[a.dataset.act](st, a, ui); ui.render(); });
  // orbit: drag anywhere that is not a clickable part (the machine turns the way the finger moves); arrow keys nudge; double-click eases back to the front view
  let drag = null, spin = false, camAnim = 0;
  const camTo = (y, p, ms=700) => { const y0 = YAW, p0 = PITCH, dy = ((y - y0 + 540) % 360) - 180, id = ++camAnim; let t = 0;
    ui.animate(dt => { if (id !== camAnim) return false; t += dt*1000; const k = Math.min(1, t / ms), e = ease(k); setCam(y0 + dy*e, p0 + (p - p0)*e); return k < 1; }); };
  ui.camTo = camTo;
  svg.addEventListener('pointerdown', e => { if (e.button || e.target.closest('[data-act]')) return;
    camAnim++; drag = { x:e.clientX, y:e.clientY, yaw:YAW, pitch:PITCH }; svg.classList.add("drag"); try { svg.setPointerCapture(e.pointerId); } catch {} });
  svg.addEventListener('pointermove', e => { if (!drag) return; const k = 300 / svg.getBoundingClientRect().width;
    setCam(drag.yaw + (e.clientX - drag.x)*.55*k, drag.pitch + (e.clientY - drag.y)*.35*k); ui.invalidate(); });
  const endDrag = () => { drag = null; svg.classList.remove('drag'); };
  svg.addEventListener('pointerup', endDrag); svg.addEventListener('pointercancel', endDrag);
  svg.addEventListener('dblclick', e => { if (!e.target.closest('[data-act]')) camTo(YAW0, PITCH0); });
  addEventListener('keydown', e => { const k = { ArrowLeft:[-15,0], ArrowRight:[15,0], ArrowUp:[0,8], ArrowDown:[0,-8] }[e.key];
    if (!k || window.GAME_KEYS || /input|textarea/i.test(e.target.tagName)) return; e.preventDefault(); camTo(YAW + k[0], PITCH + k[1], 260); });   // a game figure keeps the arrows for play
  document.getElementById('vreset').onclick = () => { spin = false; vsp.setAttribute('aria-pressed', false); camTo(YAW0, PITCH0); };
  const vsp = document.getElementById('vspin');
  vsp.onclick = () => { spin = !spin; vsp.setAttribute('aria-pressed', spin); camAnim++;
    let dir = 1;   // with a turning limit, the turntable swings back and forth inside it
    if (spin) ui.animate(dt => { if (!spin) return false; if (!drag){ let y = YAW + dir*dt*18;
      if (CAM_LIM != null && Math.abs(y - YAW0) >= CAM_LIM - .5){ dir = -dir; y = YAW + dir*dt*18; } setCam(y, PITCH); } return true; }); };
  if (q.has('yaw') || q.has('pitch')) setCam(+(q.get('yaw') ?? YAW0), +(q.get('pitch') ?? PITCH0));
  const btns = document.getElementById('btns');
  const stepEls = [];
  if (btns) cfg.buttons.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act';
    el.innerHTML = `${b.label}${b.choices ? '<span class="car">▾</span>' : ''}`;
    wrap.appendChild(el); btns.appendChild(wrap); stepEls.push(el);
    if (!b.choices){ el.onclick = () => { closeChips(); b.onClick(st, ui); ui.render(); }; return; }
    const chips = document.createElement('div'); chips.className = 'chips'; wrap.appendChild(chips);
    el.onclick = e => { e.stopPropagation(); const open = !wrap.classList.contains('open'); closeChips();
      if (!open) return;
      chips.innerHTML = '';
      // every choice stays clickable, so nothing silently ignores a press:
      //   current:true  = the one in use (shown selected); a press just says so
      //   disabled:true = not possible right now (shown faded); a press says why (c.why, or a generic note)
      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;
        if (c.current) ch.setAttribute('aria-pressed', 'true');
        ch.onclick = ev => { ev.stopPropagation(); closeChips();
          if (c.current) return ui.flash(`${c.label} — already set`);
          if (c.disabled) return ui.flash(c.why || `${c.label} isn't possible right now`);
          c.onClick(st, ui); ui.render(); }; chips.appendChild(ch); }
      wrap.classList.add('open'); };
  });
  function closeChips(){ document.querySelectorAll('.stepwrap.open').forEach(w => w.classList.remove('open')); }
  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');
  for (const [k,p] of Object.entries(PALS)){
    const b = document.createElement('button'); b.className='sw'; b.title=k; b.style.background=p.l; b.setAttribute('aria-pressed', k===st.pal);
    b.onclick = () => { st.pal=k; [...pals.children].forEach(c=>c.setAttribute('aria-pressed', c===b)); ui.render(); };
    pals.appendChild(b);
  }
  // labels: the switch appears when the figure draws any tag(); ?labels=0 starts with them hidden
  const lblctl = document.getElementById('lblctl'), lbl = document.getElementById('lbl');
  const setLabels = on => { document.documentElement.classList.toggle('nolabels', !on); lbl.textContent = on ? 'On' : 'Off'; lbl.setAttribute('aria-pressed', on); };
  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));
  if (q.get('labels') === '0') setLabels(false);
  // testing: ?press=Label@ms,Label@ms clicks the buttons whose text starts with Label at those times after load
  // (any order, repeats allowed); Label>Choice picks a choice from a picker button (?press=Speed>3@300).
  // Script errors and unknown labels are recorded on <html data-errors="…">
  window.__st = st;
  const noteErr = m => { document.documentElement.dataset.errors = (document.documentElement.dataset.errors || '') + ' ' + m + ';'; };
  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');
    setTimeout(() => { const b = [...document.querySelectorAll('.act')].find(b => starts(b, label));
      if (!b) return noteErr(`no button "${label}"`);
      b.click(); if (choice == null) return;
      const c = [...b.parentElement.querySelectorAll('.chip')].find(c => starts(c, choice));
      if (c && !c.disabled) c.click(); else noteErr(`no choice "${choice}" in "${label}"`); }, +ms || 0); });
  setLight(st.az); ui.render();
  if (art.querySelector('.tag')) lblctl.hidden = false;
  return ui;
}

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------
   xrCallouts(items, B): pills in two columns either side of the object, sorted top to bottom so leaders never cross.
     items: [{ at:[x,y,z], text, on }], B: the object's bounds [x0, x1, y0, y1, z0, z1].
   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];
  const svgEl = document.getElementById('fig'), vb = svgEl.viewBox.baseVal, btn = document.getElementById('btns');
  const wMax = u ? hgt*1.3 + 12*k : Math.max(...items.map(it => it.text.length))*fs*.62 + fs*1.5 + 12*k;
  const roomL = xmin - vb.x >= wMax*.75, roomR = vb.x + vb.width - xmax >= wMax*.75;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs + 6*k, [1]: fs + 6*k };
  if (btn && svgEl.getScreenCTM()){
    const r = btn.getBoundingClientRect(), m = svgEl.getScreenCTM().inverse();
    const q = new DOMPoint(r.right, r.bottom + 24).matrixTransform(m);
    if (q.x > xmin - wMax - 12*k && q.y > 0) top[-1] = q.y + hgt;
  }
  const stEl = document.getElementById('stats');
  if (stEl && svgEl.getScreenCTM()){
    const r = stEl.getBoundingClientRect(), m = svgEl.getScreenCTM().inverse();
    const q = new DOMPoint(r.left, r.bottom + 24).matrixTransform(m);
    if (q.x < xmax + wMax + 12*k && q.y > 0) top[1] = q.y + hgt;
  }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);
  const far = `<g opacity="${f(.5*k)}">` + loft(on(PX(x0), OUTp), on(PX(x1), OUTp), n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true)
    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...on(PX(x0), OUTp), ...on(PX(x1), OUTp)], 2.8) + `</g>`;
}
function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)
  const ui = getUI(), q = new URLSearchParams(location.search), html = document.documentElement;
  if (q.get('labels') !== '1') html.classList.add('nolabels');
  if (ui.st.xr == null){ ui.st.xr = 0; ui.st.xrT = 0; }
  if (q.get('xr') === '1') ui.st.xr = ui.st.xrT = 1;
  if (ui.st.dark == null) ui.st.dark = true;
  if (q.get('theme') === 'light') ui.st.dark = false;
  if (q.get('theme') === 'dark')  ui.st.dark = true;
  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">'
    + '<button class="act" id="thmb" aria-pressed="true">Night theme</button>'
    + (opt.labelsOnly ? '' : '<button class="act" id="xrb" aria-pressed="false">See-through</button>')
    + '<button class="act" id="lblb" aria-pressed="false">Labels</button></div>';
  document.querySelector('.stage').appendChild(vset);
  const thmb = document.getElementById('thmb'), xrb = document.getElementById('xrb'), lblb = document.getElementById('lblb');
  const sync = () => {
    const dk = !!getUI().st.dark;
    html.classList.toggle('dark', dk);
    if (thmb){ thmb.setAttribute('aria-pressed', dk); thmb.textContent = dk ? 'Night theme' : 'Light theme'; }
    if (xrb) xrb.setAttribute('aria-pressed', !!getUI().st.xrT);
    lblb.setAttribute('aria-pressed', !html.classList.contains('nolabels'));
  };
  if (thmb) thmb.onclick = () => {
    const u = getUI(), st = u.st; st.dark = !st.dark; sync();
    u.flash(st.dark ? 'Cozy night dark theme enabled' : 'Daylight paper theme enabled');
    u.render();
  };
  if (xrb) xrb.onclick = () => { const u = getUI(), st = u.st; st.xr = st.xr || 0; st.xrT = st.xrT ? 0 : 1; sync();
    u.animate(dt => { const g = Math.sign(st.xrT - st.xr); st.xr = Math.min(1, Math.max(0, st.xr + g*dt/.7)); return st.xr !== st.xrT; }); };
  lblb.onclick = () => { html.classList.toggle('nolabels'); sync(); };
  sync();
  const cap = document.createElement('p'); cap.className = 'mcap'; document.querySelector('.stage').after(cap);
  const css = document.createElement('style');
  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { sync(); r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = caption(st); };
  ui.render();
}
// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;
}
// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){
    let s = sceneFn.apply(this, arguments);
    const st = opts.getSt(), k = ease(st.xr || 0);
    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case
    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];
    return s + (items.length ? xrCallouts(items, opts.B) : '');
  };
}

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })
   An inked pad under the buttons that sends the same keyboard events as the arrows and space (set window.GAME_KEYS = true
   so the arrows play instead of turning the camera). ---------- */
function mountKeypad(spec){
  const host = document.getElementById('btns'); if (!host) return;
  const css = document.createElement('style');
  css.textContent = `.kpad{display:flex;align-items:center;gap:16px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;
      background:var(--paper);box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    .kpad .dp{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(var(--rows),34px);gap:3px}
    .kpad .k{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
      background:#fbf7ea;border:1.5px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);color:var(--ink);font:700 13px ui-monospace,Menlo,monospace;
      transition:transform .05s,box-shadow .05s,background .05s}
    .kpad .hub{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .kpad .hub i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#e6e0d1}
    .kpad .go{all:unset;box-sizing:border-box;width:62px;height:62px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#e2483d;border:1.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);color:#fff;font:800 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;
      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', 'Keypad');
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', k.name);
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

<script>
/* ============================================================
   Fig. 27 — Lo-fi night room (Colorfigures diorama)
   Real process & how the room works:

/* ---------- lamp kinematics (on desk at x=22, y=94, z=33) ---------- */
const L_BX = 22, L_BY = 94, L_BZ = 33;
const L_PHI = -32 * Math.PI / 180;
const L_U = [Math.cos(L_PHI), Math.sin(L_PHI), 0];
const L_NRM = [-Math.sin(L_PHI), Math.cos(L_PHI), 0];
const L_BASE_H = 3.2, L_POST_TOP = L_BZ + L_BASE_H + 5.2;
const L_ARM1 = 21, L_ARM2 = 19, L_SHD_LEN = 10.5, L_SHD_R0 = 2.6, L_SHD_R1 = 6.8, L_BULB_T = 8.4;

const LAMP_POSES = {
  read: { label:'Reading',    a:[64, -14, -82] },
  low:  { label:'Low focus',  a:[44, -12, -86] },
  wide: { label:'Wide glow',  a:[76,  14, -74] },
};

const lQ = (s, z) => [L_BX + s*L_U[0], L_BY + s*L_U[1], z];
const lDir = a => [Math.cos(dRad(a))*L_U[0], Math.cos(dRad(a))*L_U[1], Math.sin(dRad(a))];
function lampGeo(ang){
  const [a1, a2, a3] = ang;
  const Sh = lQ(0, L_POST_TOP);
  const El = dAdd(Sh, dScl(lDir(a1), L_ARM1));
  const Wr = dAdd(El, dScl(lDir(a2), L_ARM2));
  const dd = lDir(a3);
  return { Sh, El, Wr, dd, at: t => dAdd(Wr, dScl(dd, t)) };
}
function ringAx(c, ax, r, n=16){
  let e1, e2;
  if (Math.abs(dot(ax, L_NRM)) > .9){ e1 = L_U; e2 = [0,0,1]; }
  else if (Math.abs(ax[2]) > .99){ e1 = [1,0,0]; e2 = [0,1,0]; }
  else { e1 = L_NRM; e2 = norm(cross(ax, L_NRM)); }
  return Array.from({length:n}, (_,i) => {
    const t = i/n*2*Math.PI;
    return dAdd(c, dAdd(dScl(e1, r*Math.cos(t)), dScl(e2, r*Math.sin(t))));
  });
}
const rodTone = (n, M) => { const c = tone(n, M); return c === M.d ? M.m : c; };
function cylAx(c0, c1, r, M, sh=tone, w=1.0, n=14){
  const ax = norm(sub(c1, c0)), A = ringAx(c0, ax, r, n), B = ringAx(c1, ax, r, n);
  let s = loft(A, B, nr => sh(nr, M));
  const capB = vis(ax), cap = capB ? B : A, cn = capB ? ax : dScl(ax, -1);
  if (vis(cn)) s += fill(pd(cap), sh(cn, M));
  s += hullInk([...A, ...B], w);
  if (vis(cn)) s += ink(pd(cap), w*.7);
  return s;
}
function lampPoolPts(g, zPlane, frac=1){
  const apex = g.at(-9), rim = ringAx(g.at(L_SHD_LEN), g.dd, L_SHD_R1*frac, 28), out = [];
  for (const p of rim){
    const v = sub(p, apex);
    if (v[2] > -1e-3) return null;
    const k = (zPlane - apex[2]) / v[2];
    out.push(dAdd(apex, dScl(v, k)));
  }
  return out;
}
function lampLux(g, st){
  const base = st.fairyOn ? 45 : 12;
  if (st.lampGlow <= .01 || g.dd[2] >= -.05) return base;
  const b = g.at(L_BULB_T), dist = Math.max(.22, (b[2] - L_BZ) / -g.dd[2] / 42);
  return Math.round(base + st.lampGlow * (115 * -g.dd[2] / (dist*dist)));
}

/* ---------- 1. Floor Slab, Rug & Shadows (z = 0..5) ---------- */
const FLOOR_TOP = boardTop(0, 0, RM_W, RM_D, RM_FH, 6);
const INNER_FLOOR = on(PZ(RM_FH + .02), rectUV(RM_WT, RM_WT, RM_W - 2, RM_D - 2));

function drawFloor(st, m, g){
  let s = board(0, 0, RM_W, RM_D, RM_FH, 6, WOOD);
  // hardwood plank lines on top of floor
  if (vis([0,0,1])){
    let pl = '';
    for (let y = 18; y < RM_D - 4; y += 12){
      pl += pd([[RM_WT, y, RM_FH+.02], [RM_W - 3, y, RM_FH+.02]], false);
    }
    for (let y = 18; y < RM_D - 12; y += 12){
      const xj = 28 + ((y * 17) % 58);
      pl += pd([[xj, y, RM_FH+.02], [xj, y + 12, RM_FH+.02]], false);
    }
    s += `<path d="${pl}" fill="none" stroke="${WOOD.d}" stroke-width=".55" opacity=".55"/>`;

    // moonlight window patch on floor when night window is visible
    const moonOp = st.dark ? Math.max(.16, .38 - .18 * st.lampGlow) : Math.max(.08, .22 - .12 * st.lampGlow);
    const moonQuad = [[14, 18, RM_FH+.03], [68, 22, RM_FH+.03], [74, 72, RM_FH+.03], [14, 70, RM_FH+.03]];
    s += clipTo(INNER_FLOOR, fill(pd(moonQuad), st.dark ? '#6999eb' : '#76a0e2', `opacity="${f(moonOp)}"`));

    // warm ambient floor glow when lamp or fairy lights are on
    const warmFloor = (st.dark ? .26 : .18) * st.lampGlow + (st.dark ? .14 : .08) * st.fairyGlow;
    if (warmFloor > .01){
      const glowPts = on(PZ(RM_FH+.04), ellUV(44, 72, 38, 42, 28));
      s += clipTo(INNER_FLOOR, fill(pd(glowPts), '#ffe699', `opacity="${f(warmFloor)}"`));
    }
  }

  // cast shadows on floor
  const shParts = [
    // desk cabinet & legs
    [[16,24,RM_FH],[54,48,33],[16,102,33],[54,102,33]],
    // chair
    [[66,60,RM_FH],[82,76,48]],
    // floor plant
    [[64,96,RM_FH],[76,108,38]],
    // vinyl crate
    [[64,6.5,RM_FH],[102,19,24]]
  ];
  s += clipTo(INNER_FLOOR, shParts.map(pts => castShadow([
    [pts[0][0],pts[0][1],pts[0][2]], [pts[1][0],pts[0][1],pts[1][2]],
    [pts[1][0],pts[1][1],pts[1][2]], [pts[0][0],pts[1][1],pts[1][2]]
  ], RM_FH)).join(''));

  // woven round rug under the chair (x=74, y=68, r=21)
  const rx = 74, ry = 68, rr = 21;
  const rA = on(PZ(RM_FH + .05), ellUV(rx, ry, rr, rr, 36));
  const rB = on(PZ(RM_FH + .45), ellUV(rx, ry, rr, rr, 36));
  const rMid = on(PZ(RM_FH + .48), ellUV(rx, ry, rr * .74, rr * .74, 32));
  const rIn  = on(PZ(RM_FH + .50), ellUV(rx, ry, rr * .42, rr * .42, 24));
  s += loft(rA, rB, n => toneI(n, M_RUG)) + fill(pd(rB), M_RUG.l)
     + fill(pd(rMid), mix(m.l, '#f2efe7', .35)) + ink(pd(rMid), .6)
     + fill(pd(rIn), '#fbf8ee') + ink(pd(rIn), .5)
     + ink(pd(rB), 1.1);
  // rug fringe ticks along +x and -x edges
  let fr = '';
  for (let a = -50; a <= 50; a += 14){
    const ra = dRad(a);
    fr += pd([[rx + rr*Math.cos(ra), ry + rr*Math.sin(ra), RM_FH+.2],
              [rx + (rr+2.2)*Math.cos(ra), ry + (rr+2.2)*Math.sin(ra), RM_FH+.1]], false);
    fr += pd([[rx - rr*Math.cos(ra), ry + rr*Math.sin(ra), RM_FH+.2],
              [rx - (rr+2.2)*Math.cos(ra), ry + (rr+2.2)*Math.sin(ra), RM_FH+.1]], false);
  }
  s += `<path d="${fr}" fill="none" stroke="${INK}" stroke-width=".65" stroke-linecap="round"/>`;
  return s;
}

function drawCornerPillar(m){

  return box(0, 0, RM_FH, RM_WT, RM_WT, RM_H, wPal, tone, 1.1);
}

function drawBackWall(st, m){
  const wPal = { l: mix(m.l, M_WALL.l, .78), m: mix(m.m, M_WALL.m, .78), d: mix(m.d, M_WALL.d, .78) };
  const wy0 = 16, wy1 = 72, wz0 = 35, wz1 = 81;
  let s = '';
  // 4 convex wall blocks framing the window opening (y: 6..120, z: 5..88)
  s += box(0, RM_WT, RM_FH, RM_WT, RM_D, wz0, wPal, tone, 1.0);       // below window
  s += box(0, RM_WT, wz1,   RM_WT, RM_D, RM_H, wPal, tone, 1.0);      // above window
  s += box(0, RM_WT, wz0,   RM_WT, wy0,  wz1,  wPal, tone, 1.0);      // right of window
  s += box(0, wy1,   wz0,   RM_WT, RM_D, wz1,  wPal, tone, 1.0);      // left of window

  // Inner wall details (when facing +x)
  if (vis([1,0,0])){
    // Wooden baseboard along bottom of back wall
    s += box(RM_WT, RM_WT, RM_FH, RM_WT + .6, RM_D, RM_FH + 3.5, M_TRIM, toneI, .8);
    // Window recess reveals (top, bottom, left, right inner jambs of the window)
    s += box(1.2, wy0, wz0, RM_WT, wy1, wz0 + 1.4, M_TRIM, toneI, .9);
    s += box(1.2, wy0, wz1 - 1.4, RM_WT, wy1, wz1, M_TRIM, toneI, .9);
    s += box(1.2, wy0, wz0 + 1.4, RM_WT, wy0 + 1.6, wz1 - 1.4, M_TRIM, toneI, .9);
    s += box(1.2, wy1 - 1.6, wz0 + 1.4, RM_WT, wy1, wz1 - 1.4, M_TRIM, toneI, .9);

    // Night sky pane at x = 2.4
    const px = 2.4, py0 = wy0 + 1.6, py1 = wy1 - 1.6, pz0 = wz0 + 1.4, pz1 = wz1 - 1.4;
    const pane = on(PX(px), rectUV(py0, pz0, py1, pz1));
    let sky = fill(pd(pane), '#16203a');
    // Upper deep night gradient band
    sky += fill(pd(on(PX(px), rectUV(py0, pz0 + 22, py1, pz1))), '#0f172b');
    // Distant horizon glow
    sky += fill(pd(on(PX(px), rectUV(py0, pz0, py1, pz0 + 10))), '#26365c');

    // Crescent Moon (at y = 30, z = 69)
    const mCenter = P(px, 31, 69), mR = 5.2 * 1.2247;
    sky += `<circle cx="${f(mCenter[0])}" cy="${f(mCenter[1])}" r="${f(mR * 1.7)}" fill="#ffe898" opacity=".22"/>`;
    sky += `<circle cx="${f(mCenter[0])}" cy="${f(mCenter[1])}" r="${f(mR)}" fill="#fff4bd"/>`;
    sky += `<circle cx="${f(mCenter[0] - mR*.38)}" cy="${f(mCenter[1] - mR*.18)}" r="${f(mR * .82)}" fill="#0f172b"/>`;

    // Twinkling stars
    const stars = [[22,74,1.0],[41,75,1.2],[52,71,.9],[63,76,1.3],[67,66,.9],[24,62,.8],[47,63,1.1]];
    for (const [sy, sz, sr] of stars){
      const sp0 = P(px, sy, sz);
      sky += `<circle cx="${f(sp0[0])}" cy="${f(sp0[1])}" r="${f(sr)}" fill="#fff8d6" opacity=".88"/>`;
    }

    // Distant city skyline buildings + lit apartment windows
    const blds = [
      [17, 26, 51, '#1a2542'], [25, 35, 47, '#121a30'], [34, 45, 56, '#18223d'],
      [44, 53, 49, '#0f1629'], [52, 62, 54, '#1b2745'], [61, 71, 46, '#121a30']
    ];
    for (const [by0, by1, bz1, bcol] of blds){
      sky += fill(pd(on(PX(px), rectUV(by0, pz0, by1, bz1))), bcol);
      sky += ink(pd(on(PX(px), rectUV(by0, pz0, by1, bz1))), .6);
    }
    // Radio tower spire on building 3
    sky += line([[px, 39.5, 56], [px, 39.5, 63]], .7);
    const beacon = P(px, 39.5, 63.5);
    sky += `<circle cx="${f(beacon[0])}" cy="${f(beacon[1])}" r="1.4" fill="#ff5242"/>`;

    // Lit yellow/amber apartment windows in the skyline
    const wins = [
      [19,46],[22,46],[19,42],[28,43],[31,40],[36,52],[40,52],[36,48],[40,44],[36,40],
      [46,45],[49,42],[54,50],[58,50],[54,46],[58,42],[64,42],[67,39]
    ];
    for (const [wy, wz] of wins){
      sky += fill(pd(on(PX(px), rectUV(wy, wz, wy + 2.1, wz + 2.2))), (wy + wz) % 3 === 0 ? '#ff9e58' : '#ffd875');
    }

    // Falling diagonal rain streaks when st.rain is on
    if (st.rain){
      let rPath = '';
      const rShift = (st.rainPhase || 0) * 14;
      for (let i = 0; i < 22; i++){
        const ry = py0 + 3 + ((i * 11.3 + rShift * .4) % (py1 - py0 - 6));
        const rz = pz0 + 4 + ((i * 17.7 - rShift + 100) % (pz1 - pz0 - 8));
        rPath += pd([[px + .1, ry, rz + 4.8], [px + .1, ry + 1.8, rz]], false);
      }
      sky += `<path d="${rPath}" fill="none" stroke="#9ed4f7" stroke-width=".85" stroke-linecap="round" opacity=".78"/>`;
    }

    // Subtle glass reflection streaks
    sky += fill(pd(on(PX(px + .2), [[22, pz0+3], [26, pz0+3], [38, pz1-3], [34, pz1-3]])), '#ffffff', 'opacity=".14"');
    sky += fill(pd(on(PX(px + .2), [[29, pz0+3], [31, pz0+3], [43, pz1-3], [41, pz1-3]])), '#ffffff', 'opacity=".10"');

    s += act('window', clipTo(pane, sky));

    // Wooden window mullions (central vertical & horizontal bars)
    const my = (py0 + py1) / 2, mz = (pz0 + pz1) / 2;
    s += box(2.4, my - .8, pz0, 4.2, my + .8, pz1, M_TRIM, toneI, .8);
    s += box(2.4, py0, mz - .7, 4.2, py1, mz + .7, M_TRIM, toneI, .8);
    // Brass window handle latch
    s += box(4.2, my - .5, mz - 3.5, 5.2, my + .5, mz - 1.0, M_GOLD, toneI, .7);
    s += ink(pd(on(PX(RM_WT), rectUV(wy0, wz0, wy1, wz1))), 1.6);

    // Roller blind header at top of window
    s += cylY(RM_WT + 1.4, wy0 - 1.5, wy1 + 1.5, wz1 + 1.2, 1.8, M_RUG, toneI, 1.0);
    s += box(RM_WT + .2, wy0 - 1, wz1 - 3.5, RM_WT + 1.8, wy1 + 1, wz1 + .2, M_RUG, toneI, .8);

    // Two framed mini-posters on the left wall section (y = 80..112, z = 37..52)
    for (const [fy0, fy1, bgCol, artCol] of [[80, 94, '#fbf7ea', m.l], [97, 111, '#23304c', '#f4b829']]){
      s += box(RM_WT, fy0, 37, RM_WT + .7, fy1, 52, M_DARKW, toneI, .9);
      const art = on(PX(RM_WT + .75), rectUV(fy0 + 1.6, 38.6, fy1 - 1.6, 50.4));
      s += fill(pd(art), bgCol) + ink(pd(art), .6);
      const c0 = P(RM_WT + .8, (fy0 + fy1)/2, 44.5);
      s += `<circle cx="${f(c0[0])}" cy="${f(c0[1])}" r="${f(3.2 * INK_K)}" fill="${artCol}" stroke="${INK}" stroke-width="${f(.7*INK_K)}"/>`;
    }
  }

  // Exterior back wall details (when rotated behind: facing -x)
  if (vis([-1,0,0])){
    // Brick course lines on x = 0
    let brk = '';
    for (let z = 12; z < RM_H - 4; z += 8){
      brk += pd([[-.05, 8, z], [-.05, RM_D - 4, z]], false);
    }
    s += `<path d="${brk}" fill="none" stroke="${M_WALL.d}" stroke-width=".6" opacity=".6"/>`;
    // Exterior window pane & frame seen from outside (warm room light glowing out!)
    const outFrame = on(PX(-.02), rectUV(wy0, wz0, wy1, wz1));
    s += fill(pd(outFrame), M_TRIM.m) + ink(pd(outFrame), 1.1);
    const outPane = on(PX(-.05), rectUV(wy0 + 1.5, wz0 + 1.4, wy1 - 1.5, wz1 - 1.4));
    s += fill(pd(outPane), st.lampGlow > .1 ? '#ffdfa0' : '#2a385c') + ink(pd(outPane), 1.1);
    const omy = (wy0 + wy1) / 2, omz = (wz0 + wz1) / 2;
    s += box(-.4, omy - .8, wz0 + 1.4, 0, omy + .8, wz1 - 1.4, M_TRIM, tone, .8);
    s += box(-.4, wy0 + 1.5, omz - .7, 0, wy1 - 1.5, omz + .7, M_TRIM, tone, .8);
    // Exterior stone sill & utility breaker box

// Helper for cylinder along Y axis
function cylY(x, y0, y1, z, r, m, shade=toneI, w=1.0, n=16){
  const A = on(PY(y0), ellUV(x, z, r, r, n)), B = on(PY(y1), ellUV(x, z, r, r, n));
  const capB = vis([0,1,0]), cap = capB ? B : A, cn = capB ? [0,1,0] : [0,-1,0];
  return loft(A, B, nr => shade(nr, m))
    + (vis(cn) ? fill(pd(cap), shade(cn, m)) : '')
    + hullInk([...A, ...B], w)
    + (vis(cn) ? ink(pd(cap), w*.8) : '');
}

function drawWindowSillAndCat(st){
  // Sill spans x: 6..14.2, y: 14..74, z: 33.2..35.5
  let s = box(RM_WT, 14, 33.2, 14.2, 74, 35.5, M_TRIM, toneI, 1.1);

  s += cyl(10, 21, 39.2, 41.2, 1.8, M_LEAF, toneI, .8, 12);

  // Sleeping Ginger Tabby Cat curled on the sill (center x=10.2, y=46, z=35.5)
  const cx = 10.2, cy = 46, cz = 35.5;
  // Torso loaf (elliptical dome built from 3 stacked rings)
  const cR0 = on(PZ(cz),       ellUV(cx, cy, 3.4, 6.2, 24));
  const cR1 = on(PZ(cz + 2.6), ellUV(cx, cy, 3.3, 5.8, 24));
  const cR2 = on(PZ(cz + 4.5), ellUV(cx, cy - .3, 2.5, 4.2, 24));
  let catSvg = loft(cR0, cR1, n => toneI(n, M_CAT))
             + loft(cR1, cR2, n => toneI(n, M_CAT))
             + fill(pd(cR2), M_CAT.l)
             + hullInk([...cR0, ...cR1, ...cR2], 1.4);

  // Tabby stripes on back
  for (const dy of [-2.2, 0, 2.0]){
    catSvg += line([[cx - 1.8, cy + dy, cz + 4.3], [cx + 2.0, cy + dy, cz + 4.1]], .85);
  }

  // Cat Head at front-left of body (x = cx + 0.8, y = cy + 5.2, z = cz + 3.2)
  const hx = cx + .7, hy = cy + 5.0, hz = cz + 3.1 + (st.catAwake > 0 ? .6 : 0);
  const [hX, hY] = P(hx, hy, hz), hR = 3.2 * 1.2247;
  // Ears
  for (const sg of [-1, 1]){
    const ex = hX + sg * hR * .58, ey = hY - hR * .65;
    catSvg += `<path d="M${f(ex - hR*.28)} ${f(ey + hR*.15)}L${f(ex + sg*hR*.1)} ${f(ey - hR*.48)}L${f(ex + hR*.28)} ${f(ey + hR*.15)}Z" fill="${M_CAT.m}" stroke="${INK}" stroke-width="${f(.9*INK_K)}" stroke-linejoin="round"/>`;
    catSvg += `<path d="M${f(ex - hR*.14)} ${f(ey + hR*.08)}L${f(ex + sg*hR*.06)} ${f(ey - hR*.26)}L${f(ex + hR*.14)} ${f(ey + hR*.08)}Z" fill="#f3a6bb"/>`;
  }
  // Head sphere
  catSvg += `<circle cx="${f(hX)}" cy="${f(hY)}" r="${f(hR)}" fill="${M_CAT.l}" stroke="${INK}" stroke-width="${f(1.1*INK_K)}"/>`;
  // Eyes (sleeping curved arcs, or bright awake eyes when clicked)
  if (st.catAwake > 0){
    catSvg += `<circle cx="${f(hX - hR*.34)}" cy="${f(hY + hR*.04)}" r="${f(hR*.12)}" fill="${INK}"/>`;
    catSvg += `<circle cx="${f(hX + hR*.34)}" cy="${f(hY + hR*.04)}" r="${f(hR*.12)}" fill="${INK}"/>`;
  } else {
    catSvg += `<path d="M${f(hX - hR*.48)} ${f(hY + hR*.05)}Q${f(hX - hR*.32)} ${f(hY + hR*.22)} ${f(hX - hR*.16)} ${f(hY + hR*.05)}" fill="none" stroke="${INK}" stroke-width="${f(.75*INK_K)}" stroke-linecap="round"/>`;
    catSvg += `<path d="M${f(hX + hR*.16)} ${f(hY + hR*.05)}Q${f(hX + hR*.32)} ${f(hY + hR*.22)} ${f(hX + hR*.48)} ${f(hY + hR*.05)}" fill="none" stroke="${INK}" stroke-width="${f(.75*INK_K)}" stroke-linecap="round"/>`;
  }
  // Pink nose
  catSvg += `<circle cx="${f(hX)}" cy="${f(hY + hR*.22)}" r="${f(hR*.1)}" fill="#f2849a"/>`;

  // Swishing Tail hanging/curling at y = cy - 5.8
  const swish = Math.sin(st.tailPhase || 0) * 2.6;
  const tailPts = [
    [cx, cy - 5.4, cz + 1.8],
    [cx + 1.6, cy - 7.8, cz + 1.5 + swish * .3],
    [cx + 2.4, cy - 10.2 + swish, cz + 2.8 + Math.abs(swish) * .4]
  ];
  const td = pd(tailPts, false);
  catSvg += `<path d="${td}" fill="none" stroke="${INK}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`;
  catSvg += `<path d="${td}" fill="none" stroke="${M_CAT.l}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;

  s += act('cat', catSvg);
  return s;
}

// 6A. Vinyl Turntable: x ∈ [18, 42], y ∈ [25, 49], z ∈ [33, 42]
function drawTurntable(st, m){
  let s = '';
  // Plinth (x=19..41, y=26..48, z=33..36.5)
  s += box(19, 26, 33, 41, 48, 36.5, M_DARKW, toneI, 1.1);
  // Spinning Vinyl Platter & LP Record (center x=30, y=38.5, z=36.5..37.6, r=8.2)
  const px = 30, py = 38.5, pz = 37.5, pr = 8.2;
  s += cyl(px, py, 36.5, pz, pr, M_VINYL, toneI, 1.1, 28);
  if (vis([0,0,1])){
    // Rotating sheen streaks on the vinyl LP
    const ang = dRad(st.spinAngle || 25);
    const s1 = [px + pr*.85*Math.cos(ang), py + pr*.85*Math.sin(ang), pz + .04];
    const s2 = [px - pr*.85*Math.cos(ang), py - pr*.85*Math.sin(ang), pz + .04];
    s += `<path d="${pd([s1, s2], false)}" fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".28"/>`;
    // Groove ring
    s += ink(pd(on(PZ(pz + .03), ellUV(px, py, pr * .68, pr * .68, 24))), .45);
    // Center record label in current palette colour + spindle pin
    const lbl = on(PZ(pz + .05), ellUV(px, py, 2.8, 2.8, 18));
    s += fill(pd(lbl), m.l) + ink(pd(lbl), .6);
  }
  s += cyl(px, py, pz, pz + .9, .45, METAL, toneI, .6, 10);

  // Start/Stop button & green/amber status LED at front-right of plinth
  const led = on(PZ(36.55), ellUV(38.5, 28.5, .8, .8, 10));
  s += fill(pd(led), st.playing ? '#43c25c' : '#8d877a') + ink(pd(led), .5);
  // Pitch fader slot
  s += line([[33, 28.2, 36.55], [39, 28.2, 36.55]], .9);

  // Tonearm gimbal at (x=22.5, y=29.0, z=36.5..38.8) & pivoting arm
  const gx = 22.5, gy = 29.0, gz = 38.4;
  s += cyl(gx, gy, 36.5, gz, 1.8, METAL, toneI, .9, 16);
  // Arm swings from rest (angle 0 along +x) inward over the record (angle +26 deg toward +y)
  const armA = dRad(6 + 24 * (st.armPos || 0));
  const tip = [gx + 13.5 * Math.cos(armA), gy + 13.5 * Math.sin(armA), gz - .5 * (st.armPos || 0)];
  const back = [gx - 2.6 * Math.cos(armA), gy - 2.6 * Math.sin(armA), gz];
  s += cylAx(back, [gx, gy, gz], 1.1, DARK, toneI, .8, 12); // counterweight
  s += rod([gx, gy, gz], tip, .45, METAL, rodTone, .85);
  s += box(tip[0] - .9, tip[1] - .9, tip[2] - .4, tip[0] + .9, tip[1] + .9, tip[2] + .5, DARK, toneI, .75);

  // Floating inked musical notes when playing! (Pure SVG geometry, no unicode font symbols)
  if (st.playing){

         + `<path d="M${f(X + 1.8*k)} ${f(Y)}V${f(Y - 6.2*k)}L${f(X + 4.8*k)} ${f(Y - 4.6*k)}" fill="none" stroke="${INK}" stroke-width="${f(1.1*k)}" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
  }
  return act('turntable', s);
}

// 6D. Articulated Balanced-Arm Desk Lamp: x ∈ [16, 35], y ∈ [84, 102], z ∈ [33, 74]
function drawDeskLamp(st, m, g){
  let s = '';
  const zt = L_BZ + L_BASE_H;
  // Weighted circular base
  const bA = on(PZ(L_BZ), ellUV(L_BX, L_BY, 6.8, 6.8, 28));
  const bB = on(PZ(zt),   ellUV(L_BX, L_BY, 5.9, 5.9, 28));
  s += loft(bA, bB, n => tone(n, m)) + fill(pd(bB), m.l) + ink(pd(bB), 1.0) + hullInk([...bA, ...bB], 2.0);

  // Push switch & green pilot LED on base top
  const pz = st.pressT > 0 ? .4 : 1.3;
  s += act('lampSwitch', cyl(L_BX + 3.4, L_BY - 1.8, zt, zt + pz, 1.4, DARK, toneI, .9, 14));
  const led = on(PZ(zt + .05), ellUV(L_BX + 2.2, L_BY - 3.6, .7, .7, 10));
  s += fill(pd(led), st.lampOn ? '#43c25c' : '#8d877a') + ink(pd(led), .5);

  // Post, lower arm, shoulder hub, balance spring
  s += cyl(L_BX, L_BY, zt, zt + 1.2, 2.4, METAL, toneI, .9, 16);
  s += cylAx(lQ(0, zt + 1.2), g.Sh, 1.2, METAL, rodTone, .95, 12);
  s += cylAx(g.Sh, g.El, 1.1, METAL, rodTone, .95, 12);
  s += cylAx(dAdd(g.Sh, dScl(L_NRM, -2.0)), dAdd(g.Sh, dScl(L_NRM, 2.0)), 1.9, DARK, tone, .95, 14);

  // Helical balance spring along lower arm
  const ax = norm(sub(g.El, g.Sh)), side = dScl(L_NRM, 2.6);
  const spA = dAdd(dAdd(g.Sh, dScl(norm(cross(L_NRM, ax)), 2.8)), side);
  const spB = dAdd(dAdd(g.Sh, dScl(ax, L_ARM1 * .55)), side);
  s += ink(pd([spA, spB], false), 1.3) + `<path d="${pd([spA, spB], false)}" fill="none" stroke="${METAL.l}" stroke-width=".65" stroke-dasharray="1.2 1.0"/>`;

  // Upper arm & elbow hub
  s += cylAx(g.El, g.Wr, 1.0, METAL, rodTone, .95, 12);
  s += cylAx(dAdd(g.El, dScl(L_NRM, -1.9)), dAdd(g.El, dScl(L_NRM, 1.9)), 1.8, DARK, tone, .95, 14);

  // Volumetric light beam cone from shade mouth down to the desk
  if (st.lampGlow > .01){
    const pool = lampPoolPts(g, 33, .95);
    if (pool){
      const rim = ringAx(g.at(L_SHD_LEN), g.dd, L_SHD_R1 * .9, 24);
      s += fill(sp(hull([...rim, ...pool].map(p => P(...p)))), '#ffe898', `opacity="${f(.25 * st.lampGlow)}" pointer-events="none"`);
    }
  }

  // Lamp head: LED bulb + conical shade + back cap
  let h = '';
  const bc = P(...g.at(L_BULB_T)), br = 2.9 * 1.2247;
  const mouthIn = vis(g.dd);
  const bulb = () => (st.lampGlow > .01 ? `<circle cx="${f(bc[0])}" cy="${f(bc[1])}" r="${f(br*1.85)}" fill="#ffe58a" opacity="${f(.55*st.lampGlow)}"/>` : '')
    + `<circle cx="${f(bc[0])}" cy="${f(bc[1])}" r="${f(br)}" fill="${st.lampGlow > .5 ? '#fff7cf' : '#eef0ea'}" stroke="${INK}" stroke-width=".9"/>`;
  const r0 = ringAx(g.at(1.0), g.dd, L_SHD_R0, 24), r1 = ringAx(g.at(L_SHD_LEN), g.dd, L_SHD_R1, 24);
  const cone = loft(r0, r1, n => tone(n, m)) + hullInk([...r0, ...r1], 1.9);
  const capC = cylAx(g.at(-1.6), g.at(1.0), L_SHD_R0, m, tone, 1.2, 18);
  if (!mouthIn) h += bulb() + cone + capC;
  else h += capC + cone + fill(pd(r1), st.lampGlow > .5 ? '#fff4c4' : '#f4efe0') + clipTo(r1, bulb()) + ink(pd(r1), 1.3);
  s += act('lampShade', h);
  s += cylAx(dAdd(g.Wr, dScl(L_NRM, -2.6)), dAdd(g.Wr, dScl(L_NRM, 2.6)), 1.5, DARK, tone, .9, 14);
  return s;
}

// 7A. Swivel Study Chair: x ∈ [62, 86], y ∈ [56, 80], z ∈ [5, 54]
function drawStudyChair(st, m){
  const cx = 74, cy = 68;
  const yaw = dRad(st.chairYaw || -18);
  const rotC = (dx, dy, z) => [cx + dx*Math.cos(yaw) - dy*Math.sin(yaw), cy + dx*Math.sin(yaw) + dy*Math.cos(yaw), z];

  let s = '';
  // 5-star caster base + wheels on rug (z = 5.5..8.5)
  for (let i = 0; i < 5; i++){
    const a = yaw + i * 2 * Math.PI / 5;
    const wx = cx + 8.5 * Math.cos(a), wy = cy + 8.5 * Math.sin(a);
    s += cyl(wx, wy, RM_FH + .4, RM_FH + 2.4, 1.3, DARK, toneI, .75, 10);
    s += rod([cx, cy, RM_FH + 3.2], [wx, wy, RM_FH + 2.2], .85, DARK, rodTone, .85);
  }
  // Pneumatic center column (z = 8..21)
  s += cyl(cx, cy, RM_FH + 2.8, 21, 1.6, DARK, toneI, .95, 14);

  // Seat cushion (z = 21..25)
  s += cyl(cx, cy, 21, 25, 8.2, m, tone, 1.3, 24);

  // Armrests on left & right of seat
  for (const sg of [-1, 1]){
    const a0 = rotC(0, sg * 7.8, 23.5), a1 = rotC(0, sg * 8.4, 30.5), a2 = rotC(-3.5, sg * 8.4, 30.5);
    s += rod(a0, a1, .8, DARK, rodTone, .85) + rod(a1, a2, 1.0, DARK, rodTone, .9);
  }

  // Spine bar & curved backrest (at back of chair: +dx in local frame, so chair faces desk at -x)
  const sp0 = rotC(6.8, 0, 23), sp1 = rotC(8.2, 0, 38);
  s += rod(sp0, sp1, 1.2, DARK, rodTone, 1.0);

  // Backrest cushion (boxy rounded pillow rotated by yaw, z = 31..49)
  const bkCorners = [[-1.8,-7.2],[1.8,-7.2],[1.8,7.2],[-1.8,7.2]].map(([dx,dy]) => rotC(7.4 + dx, dy, 0));
  const bA = bkCorners.map(([x,y]) => [x, y, 31]), bB = bkCorners.map(([x,y]) => [x, y, 48]);
  s += loft(bA, bB, n => tone(n, m)) + fill(pd(bB), m.l) + ink(pd(bB), 1.0) + hullInk([...bA, ...bB], 1.6);

  return act('chair', s);
}

/* ---------- 8. See-Through Mode: Real Room Wiring & Mechanisms (35+ 3D parts) ---------- */
function roomMech(st, g){
  const parts = [], put = (b, svg) => parts.push({ box: b, svg });
  const bx = (x0, y0, z0, x1, y1, z1, M, w = .75) => put([[x0, y0, z0], [x1, y1, z1]], box(x0, y0, z0, x1, y1, z1, M, toneI, w));
  const vc = (x, y, z0, z1, r, M, w = .8, n = 16) => put([[x - r, y - r, z0], [x + r, y + r, z1]], cyl(x, y, z0, z1, r, M, toneI, w, n));
  const wire = (pts, col, w = .45) => {
    const d = pd(pts, false);
    const b = [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - .8), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + .8)];
    put(b, `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + 1.0)}" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linecap="round" stroke-linejoin="round"/>`);
  };

  const pwrOn = st.lampOn || st.fairyOn || st.playing;
  const liveCol = pwrOn ? '#ff8a3a' : '#8a5a3c';

  // 1. Timber wall studs inside Back Wall & Right Wall
  for (const y of [12, 74, 96, 116]) bx(1.5, y - 1.2, RM_FH, 4.5, y + 1.2, RM_H - 1, M_TRIM, .65);
  for (const x of [20, 56, 88, 108]) bx(x - 1.2, 1.5, RM_FH, x + 1.2, 4.5, RM_H - 1, M_TRIM, .65);

  // 2. Main Wall Junction Box & Dimmer Relay (x=1.5..5.2, y=86..94, z=42..52)
  bx(1.5, 86, 42, 5.2, 94, 52, M_IRON, .85);
  bx(2.2, 87.2, 43.5, 5.4, 92.8, 50.5, M_PCB, .7);

  // 3. Fairy Lights Step-Down 12V Transformer (x=1.8..5.4, y=102..110, z=76..83)
  bx(1.8, 102, 76, 5.4, 110, 83, st.fairyOn ? M_GOLD : M_IRON, .85);
  wire([[3.5, 90, 52], [3.5, 90, 79], [3.5, 102, 79]], st.fairyOn ? '#ffcf56' : '#55504a', .45);

  // 4. Wall Duplex Outlet behind Desk (x=2.2..6.2, y=64..70, z=12..18)
  bx(2.2, 64, 12, 6.2, 70, 18, M_IRON, .8);
  wire([[3.5, 90, 42], [3.5, 90, 15], [3.5, 70, 15]], liveCol, .5);

  // 5. Under-Desk Surge Protector Power Strip & Busbars (x=18..24, y=58..82, z=5.2..8.5)
  bx(18, 58, RM_FH + .2, 24, 82, RM_FH + 3.4, CERAMIC, .9);
  bx(19.2, 60, RM_FH + 3.4, 22.8, 80, RM_FH + 3.9, M_COPPER, .65);
  wire([[6.2, 67, 15], [12, 67, 15], [12, 67, 6.8], [18, 67, 6.8]], liveCol, .55);

  // 6. Cords from Surge Strip up to Desk Lamp & Turntable
  wire([[21, 79, 8.5], [21, 94, 8.5], [21, 94, 33]], st.lampOn ? '#ff9a3a' : '#4a4339', .45);
  wire([[21, 61, 8.5], [21, 38, 8.5], [21, 38, 33]], st.playing ? '#43c25c' : '#4a4339', .45);

  // 7. Desk Lamp Internal Mechanism: Counterweight, Switch PCB, Internal Arm Wire, Socket & LED Emitter
  vc(L_BX, L_BY, L_BZ + .3, L_BZ + 1.6, 5.2, M_IRON, .85, 20);
  bx(L_BX + .8, L_BY - 3.8, L_BZ + 1.6, L_BX + 4.4, L_BY + 1.2, L_BZ + 2.4, M_PCB, .7);
  wire([
    [L_BX, L_BY, L_BZ + 2.2], g.Sh, g.El, g.Wr, g.at(2.0)
  ], st.lampOn ? '#ffb347' : '#4a4339', .4);
  const ledPos = g.at(L_BULB_T);
  vc(ledPos[0], ledPos[1], ledPos[2] - 1.2, ledPos[2] + 1.2, 2.1, st.lampOn ? M_GOLD : METAL, .8, 14);

  // 8. Vinyl Turntable Internal Mechanism: DC Motor, Brass Pulley, Rubber Drive Belt, Platter Hub, Phono Preamp PCB
  vc(23.5, 43.5, 33.4, 36.2, 2.2, M_IRON, .85, 16);     // DC brushless motor
  vc(23.5, 43.5, 36.2, 37.0, .8,  M_GOLD, .7, 12);      // Motor brass pulley
  vc(30.0, 38.5, 33.4, 36.8, 3.8, METAL, .85, 20);      // Platter sub-hub & spindle bearing
  // Drive belt loop between motor pulley and platter sub-hub
  wire([[23.5, 44.3, 36.4], [30.0, 42.2, 36.4], [33.5, 38.5, 36.4], [29.2, 34.8, 36.4], [22.8, 42.9, 36.4], [23.5, 44.3, 36.4]], '#272421', .35);
  // Phono preamp PCB & tonearm pickup lead
  bx(33.5, 28.0, 33.6, 39.5, 35.5, 34.8, M_PCB, .75);
  wire([[22.5, 29.0, 36.5], [27.0, 29.5, 34.5], [33.5, 31.0, 34.5]], st.playing ? '#43c25c' : '#65645f', .35);

  // 9. Steel Ball-Bearing Drawer Slides inside Desk Cabinet
  const dx = 10 * (st.drawer || 0);
  bx(18, 24.6, 22.0, 53 + dx, 25.4, 23.4, METAL, .7);
  bx(18, 46.6, 22.0, 53 + dx, 47.4, 23.4, METAL, .7);

  // 10. Swivel Chair Pneumatic Gas-Lift Cylinder & Coil Spring
  vc(74, 68, RM_FH + 2.5, 21.5, 1.2, M_IRON, .85, 14);
  vc(74, 68, 15.0, 20.5, 2.1, M_GOLD, .75, 14);

  return byDepth(parts);
}

/* ---------- 9. Complete Scene Assembly (sorted back-to-front from every angle) ---------- */
function scene(st, m){
  syncThemeMaterials(st);
  const g = lampGeo(st.ang);

  // Floor slab is always at the bottom (z = 0..5, camera pitch > 0)
  const floorSvg = drawFloor(st, m, g);

  // All 3D blocks above z = 5 with non-overlapping bounding boxes
  const blocks = [
    { box:[[0, 0, RM_FH], [RM_WT, RM_WT, RM_H]],           svg: drawCornerPillar(m) },
    { box:[[0, RM_WT, RM_FH], [RM_WT, RM_D, RM_H]],        svg: drawBackWall(st, m) },
    { box:[[RM_WT, 0, RM_FH], [RM_W, RM_WT, RM_H]],        svg: drawRightWall(st, m) },
    { box:[[RM_WT, 14, 33.2], [14.2, 74, 46]],             svg: drawWindowSillAndCat(st) },

/* ---------- 11. Interactive Animations & Actions ---------- */
let ui, ambLoop = false;

function ensureLoop(){
  if (ambLoop || !ui) return;
  ambLoop = true;
  ui.animate(dt => {
    const st = ui.st;
    let active = false;

    // 1. Lamp switch & warm glow fade
    if (st.pressT > 0){ st.pressT = Math.max(0, st.pressT - dt); active = true; }
    const lGoal = st.lampOn ? 1 : 0;
    if (Math.abs(st.lampGlow - lGoal) > 1e-3){
      st.lampGlow += Math.sign(lGoal - st.lampGlow) * Math.min(Math.abs(lGoal - st.lampGlow), dt / .32);
      active = true;
    }

    // 2. Fairy lights glow fade
    const fGoal = st.fairyOn ? 1 : 0;
    if (Math.abs(st.fairyGlow - fGoal) > 1e-3){
      st.fairyGlow += Math.sign(fGoal - st.fairyGlow) * Math.min(Math.abs(fGoal - st.fairyGlow), dt / .35);
      active = true;
    }

    // 3. Lamp arm pose interpolation
    if (st.moving){
      st.poseK = Math.min(1, st.poseK + dt / .85);
      const e = ease(st.poseK);
      st.ang = st.fromAng.map((a, i) => a + (st.toAng[i] - a) * e);
      if (st.poseK >= 1) st.moving = false;
      else active = true;
    }

    // 4. Turntable tonearm & vinyl spin
    const aGoal = st.playing ? 1 : 0;
    if (Math.abs(st.armPos - aGoal) > 1e-3){
      st.armPos += Math.sign(aGoal - st.armPos) * Math.min(Math.abs(aGoal - st.armPos), dt / .55);
      active = true;
    }
    if (st.playing && st.spinTimer > 0){
      st.spinTimer = Math.max(0, st.spinTimer - dt);
      st.spinAngle = ((st.spinAngle || 0) + dt * 160) % 360;
      st.tailPhase = (st.tailPhase || 0) + dt * 4.2;
      st.steamPhase = (st.steamPhase || 0) + dt * 3.0;
      active = true;
    }

    // 5. Window rain animation burst
    if (st.rain && st.rainTimer > 0){
      st.rainTimer = Math.max(0, st.rainTimer - dt);
      st.rainPhase = ((st.rainPhase || 0) + dt * 2.4) % 10;
      active = true;
    }

    // 6. Notebook page flip
    if (st.pageFlip > 0){
      st.pageFlip = Math.min(1, st.pageFlip + dt / .65);
      if (st.pageFlip >= 1){ st.pageFlip = 0; st.pageIdx = (st.pageIdx + 1) % 3; }
      else active = true;
    }

    // 7. Desk drawer slide
    const dGoal = st.drawerOpen ? 1 : 0;
    if (Math.abs(st.drawer - dGoal) > 1e-3){
      st.drawer += Math.sign(dGoal - st.drawer) * Math.min(Math.abs(dGoal - st.drawer), dt / .5);
      active = true;
    }

    // 8. Cat purr/wake reaction
    if (st.catAwake > 0){
      st.catAwake = Math.max(0, st.catAwake - dt);
      st.tailPhase = (st.tailPhase || 0) + dt * 6.5;
      active = true;
    }

    // 9. Chair swivel
    if (st.chairAnim){
      st.chairK = Math.min(1, st.chairK + dt / .6);
      st.chairYaw = st.chairFrom + (st.chairTo - st.chairFrom) * ease(st.chairK);
      if (st.chairK >= 1) st.chairAnim = false;
      else active = true;
    }

    if (!active) ambLoop = false;
    return active;
  });
}

function toggleLamp(st, ui){
  st.lampOn = !st.lampOn;
  st.pressT = .18;
  ui.flash(st.lampOn ? 'Desk lamp switched on - warm study pool lit' : 'Desk lamp switched off - moonlight mode');
  ensureLoop();
}

function setLampPose(poseKey){
  return (st, ui) => {
    st.pose = poseKey;
    st.fromAng = st.ang.slice();
    st.toAng = LAMP_POSES[poseKey].a.slice();
    st.poseK = 0;
    st.moving = true;
    ui.flash(`Lamp arm posed to ${LAMP_POSES[poseKey].label.toLowerCase()}`);
    ensureLoop();
  };
}

function toggleTurntable(st, ui){
  st.playing = !st.playing;
  if (st.playing){
    st.spinTimer = 4.0;
    ui.flash('Playing lo-fi vinyl beats (33 RPM)');
  } else {
    st.spinTimer = 0;
    ui.flash('Turntable paused - tonearm parked');
  }
  ensureLoop();
}

function setAmbiance(mode){
  return (st, ui) => {
    if (mode === 'fairy'){
      st.fairyOn = !st.fairyOn;
      ui.flash(st.fairyOn ? 'Fairy string lights switched on' : 'Fairy string lights switched off');
    } else if (mode === 'rain'){
      st.rain = !st.rain;
      if (st.rain) st.rainTimer = 3.5;
      ui.flash(st.rain ? 'Midnight rain pattering on the window' : 'Skies cleared outside the window');
    } else if (mode === 'cozy'){
      st.lampOn = true; st.fairyOn = true; st.rain = true; st.rainTimer = 3.5;
      ui.flash('Full cozy lo-fi night mode active');
    } else if (mode === 'quiet'){
      st.lampOn = false; st.fairyOn = false; st.rain = false; st.playing = false;
      ui.flash('Quiet midnight room - moonlight only');
    }
    ensureLoop();
  };
}

function flipNotebookOrDrawer(st, ui){
  st.pageFlip = .03;
  st.drawerOpen = !st.drawerOpen;
  ui.flash(st.drawerOpen ? 'Notebook page turned / desk drawer opened' : 'Notebook page turned / desk drawer closed');
  ensureLoop();
}

<script>(() => { const fig = document.getElementById("fig"); if (!fig) return;
  const lg = document.createElement("div"); lg.className = "lgd"; const at = document.querySelector(".zwrap") || fig; at.parentNode.insertBefore(lg, at.nextSibling);
  const hs = document.createElement("style"); document.head.appendChild(hs);
  let sig = "", sel = 0, q = 0, names = "", num = new Map();
  const renum = () => { if (innerWidth > 560) return; const gs = [...fig.querySelectorAll(".tag[data-t]")];
    const key = gs.map(g => g.dataset.t).sort().join("|");
    if (key !== names){ names = key; num = new Map(); const vb = fig.viewBox.baseVal, cx = vb.x + vb.width/2;
      const at = g => { const r = g.querySelector("rect"); return r ? [+r.getAttribute("x") + r.getAttribute("width")/2, +r.getAttribute("y")] : [0, 0]; };
      gs.map(g => [g.dataset.t, ...at(g)]).sort((a, b) => ((a[1] > cx) - (b[1] > cx)) || a[2] - b[2]).forEach(([t]) => { if (!num.has(t)) num.set(t, num.size + 1); }); }
    for (const g of gs){ const n = String(num.get(g.dataset.t)); if (g.dataset.n !== n){ g.dataset.n = n; const t = g.querySelector("text"); if (t) t.textContent = n; } } };
  const mark = () => { hs.textContent = sel ? `#fig .tag[data-n="${sel}"] rect{fill:#f4b829!important}#fig .tag[data-n="${sel}"] text{fill:#191610!important}#fig .tag[data-n="${sel}"] path{stroke-width:2.4}` : "";
    for (const x of lg.children) x.classList.toggle("sel", +x.dataset.n === sel); };
  const upd = () => { q = 0; const m = new Map();
    if (innerWidth <= 560) for (const g of fig.querySelectorAll(".tag[data-n]")){ const n = +g.dataset.n; if (!m.has(n)) m.set(n, [g.dataset.t, g.classList.contains("on")]); }
    const a = [...m].sort((x, y) => x[0] - y[0]), s = JSON.stringify(a); if (s === sig) return; sig = s;
    lg.classList.toggle("has", a.length > 0);
    lg.innerHTML = a.map(([n, [t, on]]) => `<button data-n="${n}" class="${on ? "on" : ""}"><b>${n}</b><span>${t}</span></button>`).join(""); mark(); };
  lg.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; sel = sel === +b.dataset.n ? 0 : +b.dataset.n; mark(); });
  new MutationObserver(() => { renum(); if (!q) q = requestAnimationFrame(upd); }).observe(fig, { childList: true, subtree: true }); renum();
  addEventListener("resize", () => { if (!q) q = requestAnimationFrame(upd); }); upd(); })();</script></body></html>
